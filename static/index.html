<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinema Reservations</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111318;
      --panel: #1b1f29;
      --panel-2: #252b36;
      --line: #384153;
      --text: #f2f4f8;
      --muted: #a1a9b8;
      --open: #2c3340;
      --held: #d9a441;
      --taken: #c8464b;
      --mine: #4eb3f1;
      --ok: #37b26c;
      --bad: #ef6262;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    header {
      align-items: center;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      padding: 18px 28px;
    }

    h1 {
      font-size: 20px;
      margin: 0;
    }

    main {
      display: grid;
      gap: 24px;
      grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
      padding: 24px 28px;
    }

    .customer {
      color: var(--muted);
      font-size: 13px;
    }

    .film-list,
    .summary {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }

    .film-list h2,
    .summary h2 {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      margin: 0 0 12px;
      text-transform: uppercase;
    }

    .film {
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text);
      cursor: pointer;
      display: block;
      margin-top: 10px;
      padding: 12px;
      text-align: left;
      width: 100%;
    }

    .film:hover,
    .film.active {
      background: var(--panel-2);
      border-color: var(--mine);
    }

    .film strong {
      display: block;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .film span,
    .summary p,
    .legend {
      color: var(--muted);
      font-size: 13px;
    }

    .screen {
      border-top: 3px solid var(--mine);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .1em;
      margin: 0 auto 28px;
      max-width: 560px;
      padding-top: 8px;
      text-align: center;
      text-transform: uppercase;
    }

    .seat-map {
      display: grid;
      gap: 10px;
      justify-content: center;
    }

    .row {
      align-items: center;
      display: flex;
      gap: 8px;
    }

    .row-label {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      width: 24px;
    }

    .seat {
      background: var(--open);
      border: 1px solid transparent;
      border-radius: 7px 7px 4px 4px;
      color: var(--text);
      cursor: pointer;
      height: 34px;
      width: 40px;
    }

    .seat:hover {
      border-color: var(--mine);
    }

    .seat.mine {
      background: var(--mine);
      color: #071018;
      cursor: default;
    }

    .seat.held {
      background: var(--held);
      color: #120d02;
      cursor: not-allowed;
    }

    .seat.confirmed {
      background: var(--taken);
      cursor: not-allowed;
    }

    .legend {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-top: 24px;
    }

    .swatch {
      border-radius: 4px;
      display: inline-block;
      height: 12px;
      margin-right: 6px;
      vertical-align: -2px;
      width: 16px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .button {
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      flex: 1;
      font-weight: 700;
      padding: 10px 12px;
    }

    .confirm {
      background: var(--ok);
      color: #07120b;
    }

    .release {
      background: var(--bad);
      color: #180707;
    }

    .notice {
      color: var(--muted);
      font-size: 13px;
      margin-top: 12px;
      min-height: 20px;
    }

    @media (max-width: 760px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Cinema Reservations</h1>
    <div class="customer" id="customer"></div>
  </header>

  <main>
    <aside class="film-list">
      <h2>Films</h2>
      <div id="films"></div>
    </aside>

    <section>
      <div class="screen">Screen</div>
      <div class="seat-map" id="seatMap"></div>
      <div class="legend">
        <span><i class="swatch" style="background: var(--open)"></i>Open</span>
        <span><i class="swatch" style="background: var(--mine)"></i>Your hold</span>
        <span><i class="swatch" style="background: var(--held)"></i>Held</span>
        <span><i class="swatch" style="background: var(--taken)"></i>Confirmed</span>
      </div>

      <div class="summary" style="margin-top: 24px">
        <h2>Current Claim</h2>
        <div id="claimPanel">
          <p>Select a film and choose a seat.</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    const api = "/api/v1";
    const customerID = crypto.randomUUID().replaceAll("-", "").slice(0, 12);
    const state = { films: [], selected: null, seats: [], claim: null, timer: null, poll: null };

    document.getElementById("customer").textContent = "customer: " + customerID;

    function request(method, path, payload) {
      const options = { method, headers: { "Content-Type": "application/json" } };
      if (payload) options.body = JSON.stringify(payload);
      return fetch(api + path, options).then(async response => {
        if (response.status === 204) return null;
        const data = await response.json();
        if (!response.ok) {
          const message = data.error && data.error.message ? data.error.message : "Request failed";
          throw new Error(message);
        }
        return data;
      });
    }

    function loadFilms() {
      request("GET", "/films").then(data => {
        state.films = data.films;
        state.selected = state.films[0] || null;
        renderFilms();
        refreshSeats();
        state.poll = setInterval(refreshSeats, 2000);
      });
    }

    function renderFilms() {
      const root = document.getElementById("films");
      root.innerHTML = "";
      state.films.forEach(film => {
        const button = document.createElement("button");
        button.className = "film" + (state.selected && state.selected.id === film.id ? " active" : "");
        button.innerHTML = `<strong>${escapeHTML(film.title)}</strong><span>${film.rows} rows x ${film.seats_per_row} seats</span>`;
        button.addEventListener("click", () => {
          state.selected = film;
          state.claim = null;
          renderFilms();
          refreshSeats();
          renderClaim();
        });
        root.appendChild(button);
      });
    }

    function refreshSeats() {
      if (!state.selected) return;
      request("GET", `/films/${state.selected.id}/seats`).then(data => {
        state.seats = data.seats;
        renderSeats();
      });
    }

    function renderSeats() {
      const root = document.getElementById("seatMap");
      root.innerHTML = "";
      if (!state.selected) return;

      const lookup = new Map(state.seats.map(seat => [seat.seat_code, seat]));
      const rows = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      for (let row = 0; row < state.selected.rows; row++) {
        const rowEl = document.createElement("div");
        rowEl.className = "row";
        rowEl.appendChild(label(rows[row]));

        for (let col = 1; col <= state.selected.seats_per_row; col++) {
          const code = rows[row] + col;
          const seat = document.createElement("button");
          seat.className = "seat";
          seat.textContent = col;

          const info = lookup.get(code);
          if (info && info.confirmed) seat.classList.add("confirmed");
          else if (info && info.customer_id === customerID) seat.classList.add("mine");
          else if (info) seat.classList.add("held");

          seat.addEventListener("click", () => holdSeat(code));
          rowEl.appendChild(seat);
        }

        rowEl.appendChild(label(rows[row]));
        root.appendChild(rowEl);
      }
    }

    function label(text) {
      const el = document.createElement("span");
      el.className = "row-label";
      el.textContent = text;
      return el;
    }

    function holdSeat(code) {
      if (!state.selected || state.claim) return;
      request("POST", `/films/${state.selected.id}/seats/${code}/claims`, { customer_id: customerID })
        .then(claim => {
          state.claim = claim;
          renderClaim();
          refreshSeats();
        })
        .catch(showNotice);
    }

    function confirmClaim() {
      if (!state.claim) return;
      request("PUT", `/claims/${state.claim.claim_id}/confirm`, { customer_id: customerID })
        .then(() => {
          state.claim = null;
          renderClaim("Seat confirmed.");
          refreshSeats();
        })
        .catch(showNotice);
    }

    function releaseClaim() {
      if (!state.claim) return;
      request("DELETE", `/claims/${state.claim.claim_id}`, { customer_id: customerID })
        .then(() => {
          state.claim = null;
          renderClaim("Hold released.");
          refreshSeats();
        })
        .catch(showNotice);
    }

    function renderClaim(message) {
      const panel = document.getElementById("claimPanel");
      clearInterval(state.timer);

      if (!state.claim) {
        panel.innerHTML = `<p>${escapeHTML(message || "Select a film and choose a seat.")}</p>`;
        return;
      }

      panel.innerHTML = `
        <p><strong>Seat:</strong> ${escapeHTML(state.claim.seat_code)}</p>
        <p><strong>Film:</strong> ${escapeHTML(state.claim.film_id)}</p>
        <p><strong>Expires:</strong> <span id="clock">--:--</span></p>
        <div class="actions">
          <button class="button confirm" id="confirmBtn">Confirm</button>
          <button class="button release" id="releaseBtn">Release</button>
        </div>
        <div class="notice" id="notice"></div>
      `;
      document.getElementById("confirmBtn").addEventListener("click", confirmClaim);
      document.getElementById("releaseBtn").addEventListener("click", releaseClaim);
      state.timer = setInterval(updateClock, 1000);
      updateClock();
    }

    function updateClock() {
      if (!state.claim) return;
      const remaining = Math.max(0, Math.floor((new Date(state.claim.expires_at) - Date.now()) / 1000));
      const clock = document.getElementById("clock");
      if (clock) clock.textContent = `${String(Math.floor(remaining / 60)).padStart(2, "0")}:${String(remaining % 60).padStart(2, "0")}`;
      if (remaining === 0) {
        state.claim = null;
        renderClaim("Hold expired.");
        refreshSeats();
      }
    }

    function showNotice(err) {
      const notice = document.getElementById("notice");
      if (notice) notice.textContent = err.message;
      else renderClaim(err.message);
    }

    function escapeHTML(value) {
      const div = document.createElement("div");
      div.textContent = value || "";
      return div.innerHTML;
    }

    loadFilms();
  </script>
</body>

</html>
